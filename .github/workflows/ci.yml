name: Saber CI
on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/ci.yml"
      - "**.hpp"
      - "**.cpp"
      - "**CMakeLists.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/ci.yml"
      - "**.hpp"
      - "**.cpp"
      - "**CMakeLists.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"

env:
  BRANCH_NAME: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
  PRERELEASE: ${{ github.ref == 'refs/heads/dev' && 'true' || 'false' }}
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

permissions:
  contents: write
  actions: read

jobs:
  linux:
    name: linux-${{ matrix.arch }}-${{ matrix.config }}-${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
        config: [Release]
        compiler: ["g++-12"]

    env:
      OUTPUT_NAME: saber-linux-${{ matrix.arch }}-${{ matrix.config }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build rpm \
            libssl-dev zlib1g-dev linux-libc-dev \
            libtool autoconf pkg-config \
            ${{ matrix.compiler }}

      - name: Install dependencies (vcpkg)
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: x64-linux
          cache-key: linux-${{ matrix.arch }}-${{ matrix.config }}-vcpkg
          token: ${{ github.token }}

      - name: Configure CMake
        run: |
          cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} \
            -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
        env:
          CXX: ${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j $(nproc)

      - name: Rename binary
        run: mv build/bin/saber build/bin/${{ env.OUTPUT_NAME }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: build/bin/${{ env.OUTPUT_NAME }}
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
        config: [Release]
        vs:
          - { name: 2022, version: 17, os: windows-2022 }

    name: windows-${{ matrix.arch }}-${{ matrix.config }}-vs${{ matrix.vs.name }}
    runs-on: ${{ matrix.vs.os }}

    env:
      OUTPUT_NAME: saber-windows-${{ matrix.arch }}-${{ matrix.config }}.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies (vcpkg)
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.arch }}-windows-release
          cache-key: windows-${{ matrix.arch }}-${{ matrix.config }}-vcpkg
          token: ${{ github.token }}

      - name: Configure CMake
        run: |
          cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} `
            -S . -B build `
            -G "Visual Studio ${{ matrix.vs.version }} ${{ matrix.vs.name }}" `
            -A ${{ matrix.arch }} `
            -T host=${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j $env:NUMBER_OF_PROCESSORS

      - name: Rename binary
        run: Move-Item build/bin/${{ matrix.config }}/saber.exe build/bin/${{ env.OUTPUT_NAME }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: build/bin/${{ env.OUTPUT_NAME }}
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: ${{ env.BRANCH_NAME }}

      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          draft: false
          commit: ${{ github.sha }}
          tag: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          body: "*pending*"
          token: ${{ github.token }}

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ steps.semver.outputs.next }}
          writeToFile: false

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: ${{ env.PRERELEASE }}
          allowUpdates: true
          draft: false
          makeLatest: true
          commit: ${{ github.sha }}
          tag: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}

    outputs:
      next: ${{ steps.semver.outputs.next }}

  upload:
    needs: release
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload artifacts to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file_glob: true
          file: "artifacts/**/*"
          tag: ${{ needs.release.outputs.next }}
